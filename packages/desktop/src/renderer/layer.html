<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The browser's menu layer (`main/menuLayer.ts`): a Floti page in a
         transparent view above the browser's pages, drawing the bar's menus.
         The same policy as index.html, the page it stands in for. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: http://localhost:*; frame-src floti-content: floti-plugin:"
    />
    <title>Floti menu layer</title>
  </head>
  <!-- Clear wherever the menu does not draw: the corners outside its rounded edge. -->
  <body style="background: transparent">
    <div id="root"></div>
    <script type="module" src="./src/layer/main.tsx"></script>
  </body>
</html>
