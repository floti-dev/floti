name: h215 targeted tests

# Temporary, for one branch: writes the generated files the branch needs and
# runs only the tests the branch changed, once, on Linux. Removed before the
# branch is handed over.
on:
  push:
    branches: [agent/h215]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Protocol files
        run: cargo run -p floti-protocol --bin generate
      - name: The generated changes as a patch
        run: |
          git add -A
          git diff --cached --binary > generated.patch
          git diff --cached --stat
      - uses: actions/upload-artifact@v4
        with:
          name: generated
          path: generated.patch

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Targeted tests
        run: >-
          pnpm exec vitest run
          packages/desktop/src/renderer/src/app/host/sessions.test.ts
          packages/desktop/src/renderer/src/app/treeFamilies.test.ts
          packages/desktop/src/renderer/src/app/familyActions.test.ts
          packages/desktop/src/shared/host/records/index.test.ts
          packages/core/src/layout/family.test.ts
          packages/core/src/layout/familyView.test.ts
          packages/core/src/layout/childPlace.test.ts
          packages/ui/src/components/SessionTree.family.test.tsx
          packages/ui/src/components/SessionTree.status.test.tsx
          packages/ui/src/components/SessionTree.hosts.test.tsx
