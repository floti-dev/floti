name: Console of Helm's host

# Temporary: runs launcher-console.floti.test.ts, which the gate skips because
# no floti is built there, on Windows against the floti and floti-fake-gui
# this branch builds with the testkit. It fails unless both tests ran and
# passed, so the file's runIf cannot skip them unseen. Removed before the
# branch merges.
on:
  push:
    branches: [agent/h207]

concurrency:
  group: console-helm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  console:
    name: console (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # As in host.yml: V8's static library lives outside what rust-cache keeps.
      - name: Cache V8's static library
        uses: actions/cache@v4
        with:
          path: target/debug/gn_out
          key: rusty-v8-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rusty-v8-${{ runner.os }}-

      - name: Fetch V8 again when its static library is missing
        shell: bash
        run: |
          if [ ! -f target/debug/gn_out/obj/rusty_v8.lib ] && [ ! -f target/debug/gn_out/obj/librusty_v8.a ]; then
            cargo clean -p v8
          fi

      - name: Build floti and floti-fake-gui with the testkit
        run: cargo build -p floti-host --features testkit --bin floti --bin floti-fake-gui --locked

      - name: Both are where the test looks
        shell: pwsh
        run: |
          foreach ($exe in 'target\debug\floti.exe', 'target\debug\floti-fake-gui.exe') {
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { Write-Output "::error::$exe was not built"; exit 1 }
          }

      - name: The console test
        run: pnpm exec vitest run packages/desktop/src/main/host/launcher-console.floti.test.ts --reporter=default --reporter=json --outputFile.json=console-report.json

      - name: Both tests ran, none was skipped
        if: success() || failure()
        shell: bash
        run: |
          node -e '
            const report = require("./console-report.json")
            const line = `passed ${report.numPassedTests}, failed ${report.numFailedTests}, skipped ${report.numPendingTests + report.numTodoTests}`
            console.log(line)
            if (report.numPassedTests !== 2 || report.numFailedTests !== 0 || report.numPendingTests !== 0) {
              console.log(`::error::the console test did not run and pass both tests: ${line}`)
              process.exit(1)
            }
          '
