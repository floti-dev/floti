name: h215 generate

# Temporary, for one branch: rewrites protocol 4.1's record and the generated
# files as a patch, and runs the tests the branch changed. Removed before the
# branch is handed over.
on:
  push:
    branches: [agent/h215]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Protocol files
        run: |
          rm crates/floti-protocol/versions/4.1.json
          cargo run -p floti-protocol --bin generate
      - name: The generated changes as a patch
        run: |
          git add -A
          git diff --cached --binary > generated.patch
          git diff --cached --stat
      - uses: actions/upload-artifact@v4
        with:
          name: generated
          path: generated.patch

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Targeted tests
        run: >-
          pnpm exec vitest run
          packages/desktop/src/renderer/src/app/host/sessions.test.ts
          packages/desktop/src/renderer/src/app/FamilyTab.test.tsx
          packages/desktop/src/renderer/src/app/treeFamilies.test.ts
          packages/core/src/layout/family.test.ts
          packages/core/src/layout/familyView.test.ts
          packages/core/src/layout/childPlace.test.ts
          packages/core/src/layout/familyState.test.ts
          packages/core/src/layout/panes.test.ts
          packages/ui/src/components/FamilyView.test.tsx
