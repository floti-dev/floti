name: Stress flaky tests

# Temporary: runs the two tests fixed on this branch 50 times in a row on each
# OS, then the rest of their modules once. Removed before the branch merges.
on:
  push:
    branches: [agent/flaky-tests]

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  stress:
    name: stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2

      # As in host.yml: V8's static library lives outside what rust-cache keeps.
      - name: Cache V8's static library
        uses: actions/cache@v4
        with:
          path: target/debug/gn_out
          key: rusty-v8-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rusty-v8-${{ runner.os }}-

      - name: Fetch V8 again when its static library is missing
        shell: bash
        run: |
          if [ ! -f target/debug/gn_out/obj/rusty_v8.lib ] && [ ! -f target/debug/gn_out/obj/librusty_v8.a ]; then
            cargo clean -p v8
          fi

      - uses: taiki-e/install-action@v2.87.33
        with:
          tool: cargo-nextest@0.9.150

      - name: Build the integration binary
        run: cargo nextest run -p floti-host --test it --locked --no-run

      - name: The lost-child reopen test, 50 times in a row
        if: success() || failure()
        run: cargo nextest run -p floti-host --test it --locked --profile ci --stress-count 50 -E 'test(=agent_definitions::s2_a_lost_child_is_reopened_in_its_agent_as_the_file_reads_when_it_comes_back)'

      - name: The crashed-script test, 50 times in a row
        if: success() || failure()
        run: cargo nextest run -p floti-host --test it --locked --profile ci --stress-count 50 -E 'test(=plugin_runtime::a_script_that_throws_is_shown_crashed_with_its_error_cleared_and_not_restarted)'

      - name: The agent definitions module, once
        if: success() || failure()
        run: cargo nextest run -p floti-host --test it --locked --profile ci -E 'test(agent_definitions::)'

      - name: The plugin runtime module, once
        if: success() || failure()
        run: cargo nextest run -p floti-host --test it --locked --profile ci -E 'test(plugin_runtime::)'
