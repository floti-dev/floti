name: Release

# Cutting a release is bumping the version in packages/desktop/package.json and
# merging it to main. Nothing else - no tag to push by hand, no button.
#
# The plugin SDK is published to npm the same way, on its own version in
# packages/plugin-sdk/package.json: see the `sdk` job.
#
# Why the trigger is a version bump and not every merge (decided 2026-08-10):
# releasing on every merge burns a release on a typo fix in a doc and makes two
# merges in a row collide on the same tag. Why it is not a manual dispatch: the
# step a person can skip is the step that gets skipped, which is what put a
# hand-built exe from a dirty tree in front of people once already.
#
# The gate is "does this tag exist yet", not "did this commit change the
# version". Diffing against the parent commit is a different answer after a
# squash, a rebase, a revert or a re-run of this workflow; asking whether v1.2.3
# is already tagged is the same answer every time and is the question that
# actually matters. A version that is not tagged must also be greater, by
# semver, than every version that is: releases only move forward.
#
# Every file a release carries has a minisign signature beside it,
# `<file>.minisig`, with the trusted comment `floti <version> <file>`, and a
# GitHub build attestation. `sign` is the one job that reads the signing key,
# `MINISIGN_SECRET_KEY` in the `release` environment, and it checks every
# signature against the public key floti update trusts,
# crates/host/src/update/minisign.pub, before anything is published.
#
# The environment is a prerequisite the repository's owner sets up once, in
# this order (docs/PACKAGING.md, "The release environment"): create `release`
# with a deployment branch policy that admits main alone, then set the key as
# that environment's secret. A repository secret named MINISIGN_SECRET_KEY must
# never exist: every job, a dry run's included, could read it.
#
# A stable release then goes to two package managers, with the floti binary
# only: `homebrew` pushes Formula/floti.rb to floti-dev/homebrew-tap, and
# `winget` opens the pull request of FlotiDev.Floti's manifests to
# microsoft/winget-pkgs. A preview updates neither. Both run after `publish`,
# in the `release` environment, each reading one secret of its own:
# HOMEBREW_TAP_DEPLOY_KEY and WINGET_TOKEN. The tap, the deploy key, the winget
# fork and the token are prerequisites the owner creates (docs/PACKAGING.md,
# "Homebrew and winget"); while one is missing its job fails, with one line
# naming what to create, after the release is already published.
#
# A stable release also copies floti.dev's install scripts and the update
# manifest floti update reads (install.sh, install.ps1, update.json and its
# signature, written by scripts/floti-dev.mjs in `assemble` and signed in
# `sign`) to floti-dev/floti-dev.github.io: `floti-dev`, after `publish`, in
# the `release` environment, with one secret of its own, PAGES_DEPLOY_KEY,
# and the same rule while it is missing. A preview copies nothing.
#
# A push to a branch named `release-dry-run/<name>` runs all of it - the
# checks, floti, the Windows, macOS and Linux builds, the protocol types, the
# notes, the signatures and every check of the files that needs no published
# release - and publishes nothing: no tag, no release, no attestation, no npm,
# no tap push, no winget pull request and nothing on floti.dev. It signs with a key made for that
# run (`sign-dry-run`), never reads the `release` environment, uploads exactly
# the files a release would carry as the `release-files` workflow artifact and
# lists each with its SHA-256 in the run's summary. It also builds the formula
# and the winget manifests from the run's files, checks them with Homebrew and
# winget, and uploads them as `homebrew-formula` and `winget-manifests`. It
# writes floti.dev's four files from the run's own files, update.json signed
# with the run's key, uploads them as `floti-dev`, runs the install
# scripts for real against a local server (`install-dry-run`) and checks the
# setup they ran, and runs the desktop's Windows installer over that install
# and on a clean runner (`installer-dry-run`). The
# version job's `dry_run` output is what every publishing job and step gates
# on; `sign`, `publish`, `homebrew`, `winget` and `floti-dev`, the jobs that
# read a secret or write anywhere, do not run in a dry run at all. Nor does
# `add-desktop`, which runs `floti add desktop` against the release just
# published and needs a release signed with the project's key.

on:
  push:
    branches: [main, 'release-dry-run/**']

# Never cancel a release that is already uploading. `main` moving on is not a
# reason to abandon a tag halfway. A dry run publishes nothing, so a newer push
# to its branch replaces it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Cheap, and on Linux: reading one JSON field and asking the remote for its
  # tags does not need a Windows runner. The decision is
  # scripts/release.mjs's `gate`.
  #
  # Outputs: `version` and `tag`; `preview`, whether the version has a
  # pre-release part; `release`, whether the build runs (false only for a
  # version already tagged, outside a dry run); `dry_run`, whether this run
  # publishes nothing. A run on any branch but main is a dry run.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      release: ${{ steps.gate.outputs.release }}
      preview: ${{ steps.gate.outputs.preview }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - id: gate
        shell: bash
        env:
          DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
        run: |
          set -euo pipefail

          version=$(jq -er .version packages/desktop/package.json)
          tags=$(git ls-remote --tags origin 'refs/tags/v*')
          args=("$version")
          if [[ $DRY_RUN == true ]]; then args+=(--dry-run); fi

          # src/main/update.ts reads the tag, strips a leading v, and compares
          # it to app.getVersion() with /(\d+)\.(\d+)\.(\d+)/. The gate refuses
          # a version that is not semver, so that regex can always read it, and
          # one that would not sort after every tagged version.
          if ! decision=$(node packages/desktop/scripts/release.mjs gate "${args[@]}" <<<"$tags" 2>"$RUNNER_TEMP/gate.err"); then
            echo "::error file=packages/desktop/package.json::$(cat "$RUNNER_TEMP/gate.err")"
            exit 1
          fi

          for key in version tag preview release; do
            echo "$key=$(jq -r ".$key" <<<"$decision")" >>"$GITHUB_OUTPUT"
          done
          echo "dry_run=$DRY_RUN" >>"$GITHUB_OUTPUT"
          jq -r '.ignored[] | "::warning::\(.) is not a v<version> tag; the version gate ignores it"' <<<"$decision"

          tag=$(jq -r .tag <<<"$decision")
          release=$(jq -r .release <<<"$decision")
          reason=$(jq -r .reason <<<"$decision")
          if [[ $(jq -r .preview <<<"$decision") == true ]]; then kind="a preview: a public pre-release, never latest"; else kind="a release: latest"; fi

          # The decision goes to stdout as well as the summary. When the build
          # jobs are skipped there are two possible reasons - this gate said no,
          # or something they depend on failed - and telling them apart
          # afterwards should not require re-deriving the gate from the tag list.
          echo "GATE: release=$release dry_run=$DRY_RUN - $reason"
          if [[ $DRY_RUN == true ]]; then
            echo "**Dry run of \`$tag\`**, $kind, from \`$GITHUB_REF_NAME\`: everything is built and checked, and nothing is published. $reason" >>"$GITHUB_STEP_SUMMARY"
          elif [[ $release == true ]]; then
            echo "**Releasing \`$tag\`**, $kind. $reason" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "**No release.** $reason" >>"$GITHUB_STEP_SUMMARY"
          fi

  # Runs on every push to main, released or not - this is `main`'s only CI, by
  # design. ci.yml skips pushes to main, and to dry-run branches, precisely so
  # this is not a second copy of the same run. It runs `pnpm check` and the
  # build on Windows, macOS and Linux, and a failure on any one of them fails
  # it, which skips every build, the tag, the release and the SDK publish.
  check:
    uses: ./.github/workflows/ci.yml

  # floti for Windows x64 and arm64, macOS Apple Silicon and static Linux x64
  # and arm64, each checked on its own runner, and their SHA-256 list, as the
  # `floti-release` artifact. Like `check`, it runs on every push to main, and
  # a failure skips the release: a version is never published without all
  # five. The desktop's jobs carry the file for their own platform rather than
  # building floti again, so the floti in the app is the one the release lists.
  floti:
    uses: ./.github/workflows/floti.yml

  # The generated protocol types (crates/floti-protocol/generated) as one
  # archive, `floti-protocol-<version>.tar.gz`: the JSON Schema, the frame
  # fixtures and the TypeScript declarations, under a folder of the same name.
  # The crate's own test proves they are this protocol's before they are packed.
  protocol:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol

      - name: Check the generated files are this protocol's
        run: cargo test --locked -p floti-protocol --test generated_files

      # The same commit packs to the same bytes: sorted, owned by nobody,
      # dated by the commit, and gzipped with no name or time of its own.
      - name: Pack them
        shell: bash
        run: |
          set -euo pipefail
          name="floti-protocol-$VERSION"
          mkdir -p "$RUNNER_TEMP/protocol/$name" "$RUNNER_TEMP/protocol-types"
          cp crates/floti-protocol/generated/floti-protocol.schema.json \
             crates/floti-protocol/generated/floti-protocol.frames.json \
             crates/floti-protocol/generated/floti-protocol.generated.ts \
             "$RUNNER_TEMP/protocol/$name/"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
              -C "$RUNNER_TEMP/protocol" -cf - "$name" \
            | gzip -9n >"$RUNNER_TEMP/protocol-types/$name.tar.gz"
          tar -tzvf "$RUNNER_TEMP/protocol-types/$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: protocol-types
          path: ${{ runner.temp }}/protocol-types/
          if-no-files-found: error
          retention-days: 1

  # The Windows artefacts, on a clean windows-latest runner. Like the macOS
  # and Linux jobs it publishes nothing: it hands its files to `assemble`.
  release-windows:
    needs: [version, check, floti]
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # Version comes from `packageManager` in package.json; see ci.yml.

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Which pnpm will electron-builder find
        shell: bash
        run: |
          # scripts/dist-win.mjs guards against a stale standalone pnpm.exe
          # shadowing the managed shim, because electron-builder resolves the
          # command with which() and PATHEXT prefers .EXE over .CMD. That guard
          # was written for one broken machine and has never run on a clean
          # runner. Print what it will see, so the log carries the evidence
          # instead of the assumption - and so the day it *does* fire here,
          # this step is the thing that already told you why.
          where.exe pnpm || echo '(no pnpm on PATH - dist-win.mjs will say so)'
          pnpm --version

      - name: Fetch the release's floti files
        uses: actions/download-artifact@v4
        with:
          name: floti-release
          path: ${{ runner.temp }}/floti-release

      # The artefacts carry the release's floti for Windows x64, its floti
      # for Windows on arm64 as floti-arm64.exe, which `floti install-self`
      # installs on an arm64 computer, and the release's SHA-256 list, staged
      # by scripts/stage-floti.mjs, which checks both against the list.
      - name: Build artefacts
        env:
          FLOTI_PREBUILT: ${{ runner.temp }}/floti-release/floti-${{ env.VERSION }}-windows-x64.exe
          FLOTI_PREBUILT_ARM64: ${{ runner.temp }}/floti-release/floti-${{ env.VERSION }}-windows-arm64.exe
          FLOTI_SHA256SUMS: ${{ runner.temp }}/floti-release/floti-${{ env.VERSION }}-SHA256SUMS
        run: pnpm dist:win

      - name: Verify the app carries the release's two Windows flotis and its SHA-256 list
        shell: bash
        run: |
          set -euo pipefail
          resources=packages/desktop/dist-app/win-unpacked/resources
          cmp "$RUNNER_TEMP/floti-release/floti-$VERSION-windows-x64.exe" "$resources/floti.exe"
          cmp "$RUNNER_TEMP/floti-release/floti-$VERSION-windows-arm64.exe" "$resources/floti-arm64.exe"
          cmp "$RUNNER_TEMP/floti-release/floti-$VERSION-SHA256SUMS" "$resources/floti-SHA256SUMS"

      - name: Verify the artefacts carry their unpacked native modules
        shell: bash
        run: |
          node packages/desktop/scripts/verify-artifact.mjs \
            "packages/desktop/dist-app/Helm-$VERSION-portable.exe" \
            "packages/desktop/dist-app/Helm-$VERSION-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            packages/desktop/dist-app/Helm-${{ env.VERSION }}-portable.exe
            packages/desktop/dist-app/Helm-${{ env.VERSION }}-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The macOS artefacts, built where electron-builder can make a dmg.
  release-mac:
    needs: [version, check, floti]
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch the release's floti files
        uses: actions/download-artifact@v4
        with:
          name: floti-release
          path: ${{ runner.temp }}/floti-release

      # Ad-hoc signed (`identity: '-'` in electron-builder.yml): there is no
      # Developer ID, and no certificate or secret is involved. The app carries
      # the release's floti for macOS arm64 and the release's SHA-256 list,
      # staged by scripts/stage-floti.mjs, which checks the one against the
      # other.
      - name: Build artefacts
        env:
          FLOTI_PREBUILT: ${{ runner.temp }}/floti-release/floti-${{ env.VERSION }}-macos-arm64
          FLOTI_SHA256SUMS: ${{ runner.temp }}/floti-release/floti-${{ env.VERSION }}-SHA256SUMS
        run: pnpm dist:mac

      - name: Verify the app carries the release's floti and its SHA-256 list
        run: |
          set -euo pipefail
          resources=packages/desktop/dist-app/mac-arm64/Helm.app/Contents/Resources
          cmp "$RUNNER_TEMP/floti-release/floti-$VERSION-macos-arm64" "$resources/floti"
          cmp "$RUNNER_TEMP/floti-release/floti-$VERSION-SHA256SUMS" "$resources/floti-SHA256SUMS"

      - name: Verify the artefacts are arm64, ad-hoc signed, with Helm's icon and their native modules
        run: |
          node packages/desktop/scripts/verify-mac-artifact.mjs \
            "packages/desktop/dist-app/Helm-$VERSION-arm64.dmg" \
            "packages/desktop/dist-app/Helm-$VERSION-arm64-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            packages/desktop/dist-app/Helm-${{ env.VERSION }}-arm64.dmg
            packages/desktop/dist-app/Helm-${{ env.VERSION }}-arm64-mac.zip
          if-no-files-found: error
          # Already compressed, and only `assemble` reads them.
          compression-level: 0
          retention-days: 1

  # The Linux AppImage, x64 only. node-pty ships no Linux prebuild, so the
  # install compiles its N-API addon here, which loads in Electron unchanged -
  # but only on a glibc at least as new as the one it was compiled against.
  # So it is built in Ubuntu 22.04 (glibc 2.35), not on the runner's own
  # newer system, and verify-linux-artifact.mjs refuses any file in the
  # AppImage that needs a glibc newer than 2.34, the floor better-sqlite3's
  # prebuild already sets.
  release-linux:
    needs: [version, check, floti]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      # What the checkout, node-gyp and electron-builder need, which the bare
      # image does not have.
      - name: Build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 make g++ xz-utils

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch the release's floti files
        uses: actions/download-artifact@v4
        with:
          name: floti-release
          path: ${{ runner.temp }}/floti-release

      # The AppImage carries the release's static floti for Linux x64 and the
      # release's SHA-256 list, staged by scripts/stage-floti.mjs, which checks
      # the one against the other.
      - name: Build artefacts
        env:
          FLOTI_PREBUILT: ${{ runner.temp }}/floti-release/floti-${{ env.VERSION }}-linux-x64
          FLOTI_SHA256SUMS: ${{ runner.temp }}/floti-release/floti-${{ env.VERSION }}-SHA256SUMS
        run: pnpm dist:linux

      - name: Verify the AppImage is x64 and carries the release's floti, its SHA-256 list and its native modules
        run: |
          node packages/desktop/scripts/verify-linux-artifact.mjs \
            "packages/desktop/dist-app/Helm-$VERSION-linux-x64.AppImage" \
            --floti "$RUNNER_TEMP/floti-release/floti-$VERSION-linux-x64" \
            --sums "$RUNNER_TEMP/floti-release/floti-$VERSION-SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: packages/desktop/dist-app/Helm-${{ env.VERSION }}-linux-x64.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Every file the release signs, in one folder, checked to be exactly the
  # release's (scripts/release.mjs), and the notes. It publishes nothing and
  # signs nothing: it hands the files to `sign`, or in a dry run to
  # `sign-dry-run`, and the notes to `publish`.
  assemble:
    needs: [version, check, floti, protocol, release-windows, release-mac, release-linux]
    # No always()/!cancelled() here, deliberately: a failed check or build
    # must skip this job and `publish` after it, and the default `needs`
    # behaviour is what does that. A version is never published with half its
    # downloads.
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PREVIEW: ${{ needs.version.outputs.preview }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Release notes link a range against the previous tag, and the
          # default shallow checkout has neither the history nor the tags.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch the floti files
        uses: actions/download-artifact@v4
        with:
          name: floti-release
          path: ${{ runner.temp }}/release

      - name: Fetch the desktop files
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      - name: Fetch the protocol types
        uses: actions/download-artifact@v4
        with:
          name: protocol-types
          path: ${{ runner.temp }}/release

      - name: Compose the release notes
        shell: bash
        run: |
          set -euo pipefail

          # Notes come from CHANGELOG.md, and neither from git log nor from
          # GitHub's generate_release_notes.
          #
          # generate_release_notes lists *merged pull requests*; this repo's
          # history is branches merged locally, so it would produce a body that
          # is a "Full Changelog" link and nothing else.
          #
          # `git log` was what this did through 0.4.0, on the argument that the
          # commit subjects here are already one-line statements of what landed.
          # They are - but of what landed in the *repository*. 0.4.0 produced
          # fifty-nine of them, most naming a probe id, a fixture or a refactor,
          # and three identical lines from one cherry-pick onto three branches.
          # Filtering by path gets some of it and cannot get the rest: the same
          # file is touched for a reason a user sees and for a reason they never
          # will, and only the person who wrote it knows which. So it is written
          # down rather than derived.
          # A preview's tag is not a release a later one is measured from.
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -v -- - | head -n1 || true)

          # The note at the top of release-body.md is addressed to whoever edits
          # that file, not to somebody downloading Helm. An HTML comment does not
          # render on the release page, but it is still in the body the API
          # returns and the one the edit box shows - and substitution would
          # rewrite the very placeholder the note is explaining. Strip comments
          # first, then substitute, then drop the blank lines the strip left.
          mkdir -p "$RUNNER_TEMP/notes"
          notes="$RUNNER_TEMP/notes/notes.md"
          sed '/^<!--$/,/^-->$/d' .github/release-body.md \
            | sed '/./,$!d' \
            | sed "s/\${VERSION}/$VERSION/g" >"$notes"
          # The section for this version, from its own heading to the next one.
          # Matched on the exact version so `0.4.10` can never be answered by
          # `0.4.1`'s section.
          section=$(awk -v want="## $VERSION" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md)

          # Fails the release rather than publishing an empty body. Writing the
          # section is the step a person can skip, and the step a person can
          # skip is the step that gets skipped - so it is the step that stops
          # the build. No tag is created when this job fails, so the remedy is
          # to add the section and push again.
          if [[ -z ${section//[[:space:]]/} ]]; then
            echo "::error file=CHANGELOG.md::no '## $VERSION' section in CHANGELOG.md, so there is nothing to tell anyone about this release"
            exit 1
          fi

          # Whether an entry is worth telling somebody about is a judgement and
          # this cannot make it. What it can do is catch the one failure that
          # actually happened - a commit log pasted in - because that leaves
          # fingerprints nothing written for a reader ever has: a probe id, a
          # `pnpm` invocation, the name of a check.
          #
          # The prefixes are listed rather than matched as `[A-Z]+-[0-9]+`, which
          # would refuse a release for saying UTF-8 or SHA-256.
          noise=$(echo "$section" \
            | grep -nEi '\b(CFG|AFF|SESS|PKG|PROF|HIST|CONT|PR|USE|S|T)-[0-9]+[a-z]?\b|pnpm |[a-z]+-check\b' \
            || true)
          if [[ -n $noise ]]; then
            echo "::error file=CHANGELOG.md::the '## $VERSION' section reads like a commit log, not a changelog. A release page is read by somebody deciding whether to download an exe; probe ids, checks and pnpm commands mean nothing to them and the commits are one click away under Full changelog. Offending lines:"
            echo "$noise"
            exit 1
          fi

          {
            echo
            echo "$section"
            if [[ -n $previous ]]; then
              echo
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            fi
          } >>"$notes"

          count=$(git log --no-merges --oneline ${previous:+"$previous..HEAD"} | wc -l)
          if [[ $count -eq 0 ]]; then
            echo "::error::no commits since $previous, so there is nothing to release"
            exit 1
          fi
          echo "$count commit(s) since ${previous:-the beginning}."

      # Each floti file matches the SHA-256 its list gives.
      - name: Confirm the floti files' SHA-256s
        shell: bash
        working-directory: ${{ runner.temp }}/release
        run: sha256sum --check --strict "floti-$VERSION-SHA256SUMS"

      # The desktop files' SHA-256 list, `Helm-<version>-SHA256SUMS`, which
      # `floti add desktop` checks a download against. The app carries
      # floti's own list, so that list cannot hold the app; this one is signed
      # with the comment `floti <version> <file>` as every file is.
      - name: Write the desktop files' SHA-256 list
        shell: bash
        run: |
          set -euo pipefail
          node packages/desktop/scripts/release.mjs desktop-sums "$RUNNER_TEMP/release" "$VERSION"
          cd "$RUNNER_TEMP/release"
          sha256sum --check --strict "Helm-$VERSION-SHA256SUMS"

      # Exactly the files the release signs - the five desktop files and
      # their list, the protocol types, the five floti files and their list -
      # and nothing else. The signing job lists them, signatures and all, in
      # the summary.
      - name: Confirm the release's files
        shell: bash
        run: |
          set -euo pipefail
          node packages/desktop/scripts/release.mjs check "$RUNNER_TEMP/release" "$VERSION" --unsigned
          {
            echo
            echo "<details><summary>Release notes for \`$TAG\`</summary>"
            echo
            cat "$RUNNER_TEMP/notes/notes.md"
            echo
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

      # floti.dev's install scripts, with this release's version, download
      # folder and floti SHA-256s written in, and update.json, which `floti
      # update` reads (scripts/floti-dev.mjs). A preview writes no manifest
      # (decision I13), so a preview's dry run writes the one a stable
      # release of the same number would, its files renamed, to check that
      # form. A dry run also writes the scripts again, downloading from the
      # local server `install-dry-run` serves the run's files from.
      - name: Write the floti.dev files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/floti-dev"
          sums="$RUNNER_TEMP/release/floti-$VERSION-SHA256SUMS"
          node packages/desktop/scripts/floti-dev.mjs scripts "$sums" "$VERSION" "$GITHUB_REPOSITORY" "$out"
          if [[ $PREVIEW == false ]]; then
            node packages/desktop/scripts/floti-dev.mjs manifest "$RUNNER_TEMP/release" "$VERSION" "$GITHUB_REPOSITORY" "$out/update.json"
          elif [[ $DRY_RUN == true ]]; then
            node packages/desktop/scripts/floti-dev.mjs manifest "$RUNNER_TEMP/release" "$VERSION" "$GITHUB_REPOSITORY" "$out/update.json" --as-stable
          else
            echo "$VERSION is a preview, so it writes no update.json."
          fi
          if [[ $DRY_RUN == true ]]; then
            node packages/desktop/scripts/floti-dev.mjs scripts "$sums" "$VERSION" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/floti-dev-local" \
              --release-url http://127.0.0.1:8765
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: floti-dev-unsigned
          path: ${{ runner.temp }}/floti-dev/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: env.DRY_RUN == 'true'
        with:
          name: install-scripts-local
          path: ${{ runner.temp }}/floti-dev-local/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error
          retention-days: 1

  # Signs every file with the project's minisign key and checks every
  # signature against the public key committed at
  # crates/host/src/update/minisign.pub, the one floti update trusts, before
  # anything is published. The only job that reads the key: the `release`
  # environment holds it, and that environment's deployment branch policy
  # admits main alone - once the owner has created it that way, which the
  # comment at the top of this file and docs/PACKAGING.md describe. A dry run
  # never reaches this job; `sign-dry-run` signs that run's files instead.
  #
  # The key reaches one step, as a variable that minisign.mjs writes to an
  # owner-only file under $RUNNER_TEMP and removes before the step ends,
  # whether signing worked or not. Never echo it, never put it in a file of the
  # workspace and never pass it on a command line.
  #
  # Without the committed public key this job fails a real release by design:
  # nothing would show the signatures are ones floti update accepts.
  sign:
    needs: [version, assemble]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PREVIEW: ${{ needs.version.outputs.preview }}
      PUBLIC_KEY: crates/host/src/update/minisign.pub

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Fetch the release's files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-unsigned
          path: ${{ runner.temp }}/release

      - name: Fetch the floti.dev files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: floti-dev-unsigned
          path: ${{ runner.temp }}/floti-dev

      - uses: ./.github/actions/minisign

      # The files to sign, one path per line, made before any step that sees
      # the key, so that step runs nothing but the signing. update.json is
      # signed with its own comment, and only a stable release has one.
      - name: List the files to sign
        shell: bash
        run: |
          set -euo pipefail
          node packages/desktop/scripts/release.mjs names "$VERSION" --unsigned | sed "s|^|$RUNNER_TEMP/release/|" >"$RUNNER_TEMP/to-sign"
          manifest="$RUNNER_TEMP/floti-dev/update.json"
          if [[ $PREVIEW == false && ! -s $manifest ]]; then
            echo "::error::assemble wrote no update.json for the stable release $VERSION"
            exit 1
          fi
          if [[ -e $manifest ]]; then echo "$manifest" >"$RUNNER_TEMP/manifest-to-sign"; else : >"$RUNNER_TEMP/manifest-to-sign"; fi

      - name: Confirm the public key and the signing key are there
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [[ ! -s $PUBLIC_KEY ]]; then
            echo "::error file=$PUBLIC_KEY::$PUBLIC_KEY is not on this commit, so no signature can be checked against the key floti update trusts. A release cannot be published until the project's public key is committed."
            exit 1
          fi
          if [[ -z ${MINISIGN_SECRET_KEY:-} ]]; then
            echo "::error::MINISIGN_SECRET_KEY is not set in the release environment, so nothing can be signed."
            exit 1
          fi

      - name: Sign every file
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          mapfile -t files <"$RUNNER_TEMP/to-sign"
          mapfile -t manifest <"$RUNNER_TEMP/manifest-to-sign"
          node packages/desktop/scripts/minisign.mjs sign --comment "floti $VERSION {name}" "${files[@]}"
          if (( ${#manifest[@]} > 0 )); then
            node packages/desktop/scripts/minisign.mjs sign --comment "floti update.json" "${manifest[@]}"
          fi

      - name: Check every signature against the committed public key
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files <"$RUNNER_TEMP/to-sign"
          mapfile -t manifest <"$RUNNER_TEMP/manifest-to-sign"
          node packages/desktop/scripts/minisign.mjs verify --public-key "$PUBLIC_KEY" --comment "floti $VERSION {name}" "${files[@]}"
          if (( ${#manifest[@]} > 0 )); then
            node packages/desktop/scripts/minisign.mjs verify --public-key "$PUBLIC_KEY" --comment "floti update.json" "${manifest[@]}"
          fi

      # Exactly the release's files and a signature beside each, and nothing
      # else, each listed with its SHA-256 in the summary.
      - name: Confirm the release's files
        shell: bash
        run: |
          set -euo pipefail
          table=$(node packages/desktop/scripts/release.mjs check "$RUNNER_TEMP/release" "$VERSION")
          {
            echo
            echo "### The files \`$TAG\` carries"
            echo
            echo "Each \`.minisig\` is signed with the key whose public half is \`$PUBLIC_KEY\`."
            echo
            echo "$table"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$table"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      # What `floti-dev` copies to floti.dev after `publish`: the install
      # scripts, and for a stable release update.json and its signature.
      # Kept 90 days, so `floti-dev` can be re-run long after the release,
      # once a missing PAGES_DEPLOY_KEY exists: a re-run of a failed job
      # fetches what this run's `sign` uploaded.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: floti-dev
          path: ${{ runner.temp }}/floti-dev/
          if-no-files-found: error
          retention-days: 90

  # A dry run's signatures, made as `sign` makes a release's but with a key
  # pair made in this run and checked against that pair's public key. It
  # reads no secret and no environment. Its files, signatures included, are
  # what the dry run leaves behind as `release-files`.
  sign-dry-run:
    needs: [version, assemble]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch the release's files
        uses: actions/download-artifact@v4
        with:
          name: release-unsigned
          path: ${{ runner.temp }}/release

      - name: Fetch the floti.dev files
        uses: actions/download-artifact@v4
        with:
          name: floti-dev-unsigned
          path: ${{ runner.temp }}/floti-dev

      - uses: ./.github/actions/minisign

      # The files to sign, one path per line, made before any step that sees
      # the key, so that step runs nothing but the signing.
      - name: List the files to sign
        shell: bash
        run: node packages/desktop/scripts/release.mjs names "$VERSION" --unsigned | sed "s|^|$RUNNER_TEMP/release/|" >"$RUNNER_TEMP/to-sign"

      # The secret half lives for this step alone. It reaches minisign.mjs the
      # way the release's does, as MINISIGN_SECRET_KEY, so the dry run signs
      # through the same code, update.json with its own comment as `sign`
      # signs a stable release's.
      - name: Sign every file with a key made for this run
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keys="$RUNNER_TEMP/dry-run-key"
          mkdir "$keys"
          trap 'rm -f "$keys/minisign.key"' EXIT
          minisign -G -W -p "$keys/minisign.pub" -s "$keys/minisign.key" >/dev/null
          mapfile -t files <"$RUNNER_TEMP/to-sign"
          MINISIGN_SECRET_KEY=$(<"$keys/minisign.key") node packages/desktop/scripts/minisign.mjs sign --comment "floti $VERSION {name}" "${files[@]}"
          MINISIGN_SECRET_KEY=$(<"$keys/minisign.key") node packages/desktop/scripts/minisign.mjs sign --comment "floti update.json" \
            "$RUNNER_TEMP/floti-dev/update.json"

      - name: Check every signature against this run's public key
        shell: bash
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/dry-run-key"
          [[ ! -e $keys/minisign.key ]] || { echo "::error::the dry run's secret key outlived the step that made it"; exit 1; }
          mapfile -t files <"$RUNNER_TEMP/to-sign"
          node packages/desktop/scripts/minisign.mjs verify --public-key "$keys/minisign.pub" --comment "floti $VERSION {name}" "${files[@]}"
          node packages/desktop/scripts/minisign.mjs verify --public-key "$keys/minisign.pub" --comment "floti update.json" \
            "$RUNNER_TEMP/floti-dev/update.json"

      - name: Confirm the release's files
        shell: bash
        run: |
          set -euo pipefail
          table=$(node packages/desktop/scripts/release.mjs check "$RUNNER_TEMP/release" "$VERSION")
          public=$(tail -n1 "$RUNNER_TEMP/dry-run-key/minisign.pub")
          {
            echo
            echo "### The files \`$TAG\` would carry, in the \`release-files\` artifact"
            echo
            echo "Each \`.minisig\` is signed with a key made for this run, not the project's, and checked against its public key, \`$public\`. A dry run makes no attestation."
            echo
            echo "$table"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$table"

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          # What a dry run is for, so it stays a week.
          retention-days: 7

      # The four files a stable release copies to floti.dev, as `sign` hands
      # them to `floti-dev`, with update.json signed by this run's key.
      - name: List the floti.dev files
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "### The files a stable release copies to floti.dev, in the \`floti-dev\` artifact"
            echo
            echo "\`update.json\` is signed with this run's key, with the trusted comment \`floti update.json\`."
            echo
            echo '| File | SHA-256 |'
            echo '|---|---|'
            (cd "$RUNNER_TEMP/floti-dev" && sha256sum -- * | while read -r sum name; do echo "| \`$name\` | \`$sum\` |"; done)
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: floti-dev
          path: ${{ runner.temp }}/floti-dev/
          if-no-files-found: error
          retention-days: 7

      # The SHA-256 list, its signature and this run's public key, which
      # `packages-dry-run` checks as `homebrew` and `winget` check a release's.
      - name: Gather the SHA-256 list, its signature and the run's public key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dry-run-sums"
          cp "$RUNNER_TEMP/release/floti-$VERSION-SHA256SUMS" "$RUNNER_TEMP/release/floti-$VERSION-SHA256SUMS.minisig" \
            "$RUNNER_TEMP/dry-run-sums/"
          cp "$RUNNER_TEMP/dry-run-key/minisign.pub" "$RUNNER_TEMP/dry-run-sums/dry-run-minisign.pub"

      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-sums
          path: ${{ runner.temp }}/dry-run-sums/
          if-no-files-found: error
          retention-days: 1

  # A dry run's Homebrew formula and winget manifests, built as `homebrew` and
  # `winget` build a release's (scripts/package-managers.mjs): from the run's
  # SHA-256 list, after its signature is checked by the same published-sums
  # action, here against the public key of the pair `sign-dry-run` made. A
  # preview's dry run builds them too, although a preview updates neither.
  #
  # Beside them it builds the formula a stable release of the same number
  # would push, from the same list with the files renamed, so the stable form
  # is checked even when the branch's version is a preview.
  packages-dry-run:
    needs: [version, sign-dry-run]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch the run's SHA-256 list, its signature and its public key
        uses: actions/download-artifact@v4
        with:
          name: dry-run-sums
          path: ${{ runner.temp }}/dry-run-sums

      - id: sums
        uses: ./.github/actions/published-sums
        with:
          version: ${{ env.VERSION }}
          tag: ${{ env.TAG }}
          folder: ${{ runner.temp }}/dry-run-sums
          public-key: ${{ runner.temp }}/dry-run-sums/dry-run-minisign.pub

      - name: Write the formulas and the manifests
        shell: bash
        env:
          SUMS: ${{ steps.sums.outputs.sums }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/packages"
          mkdir -p "$out/homebrew/Formula" "$out/homebrew-stable/Formula"
          node packages/desktop/scripts/package-managers.mjs formula "$SUMS" "$VERSION" "$GITHUB_REPOSITORY" \
            >"$out/homebrew/Formula/floti.rb"
          stable=${VERSION%%-*}
          sed "s/ floti-$VERSION-/ floti-$stable-/" "$SUMS" >"$RUNNER_TEMP/stable-sums"
          node packages/desktop/scripts/package-managers.mjs formula "$RUNNER_TEMP/stable-sums" "$stable" "$GITHUB_REPOSITORY" \
            >"$out/homebrew-stable/Formula/floti.rb"
          node packages/desktop/scripts/package-managers.mjs winget "$SUMS" "$VERSION" "$GITHUB_REPOSITORY" "$out/winget" >/dev/null
          find "$out" -type f | LC_ALL=C sort | while IFS= read -r file; do echo "--- ${file#"$out"/}"; cat "$file"; done

      - name: Fetch the floti.dev files
        uses: actions/download-artifact@v4
        with:
          name: floti-dev
          path: ${{ runner.temp }}/floti-dev

      # The checks `floti-dev` makes before it pushes a release's files, with
      # the run's signature-checked list and key; update.json is the stable
      # form, so it is checked against the list renamed above.
      - name: Check the floti.dev files as floti-dev checks a release's
        shell: bash
        working-directory: ${{ runner.temp }}/floti-dev
        env:
          SUMS: ${{ steps.sums.outputs.sums }}
        run: |
          set -euo pipefail
          scripts="$GITHUB_WORKSPACE/packages/desktop/scripts"
          node "$scripts/minisign.mjs" verify --public-key "$RUNNER_TEMP/dry-run-sums/dry-run-minisign.pub" --comment "floti update.json" update.json
          node "$scripts/floti-dev.mjs" check-manifest update.json "$RUNNER_TEMP/stable-sums" "${VERSION%%-*}" "$GITHUB_REPOSITORY"
          node "$scripts/floti-dev.mjs" check-scripts . "$SUMS" "$VERSION" "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: |
            ${{ runner.temp }}/packages/homebrew/
            ${{ runner.temp }}/packages/homebrew-stable/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/packages/winget/
          if-no-files-found: error
          retention-days: 7

  # The dry run's formula, checked by Homebrew itself on macOS arm64 and Linux
  # x64, in the order the documented install line takes: `brew trust` on the
  # tap before it is tapped, then the tap (here a tap of its own on the
  # runner, made with `brew tap-new`, where `brew install` would tap it), then
  # the formula. `brew style` and `brew audit --strict` check it and the stable
  # form beside it, then `brew install` and `brew test` run it, with the run's
  # own file put in Homebrew's download cache first, so the formula installed
  # is the very text a release would push, URLs and all, though nothing is
  # published at them. Pushes nothing.
  homebrew-dry-run:
    needs: [version, packages-dry-run]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: macos-arm64
          - runner: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # The tap's own name, so `brew audit` sees the formula where it will live.
      TAP: floti-dev/tap
      # Where the stable form is checked, beside it.
      STABLE_TAP: floti-dev/stable
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Fetch the formulas
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: ${{ runner.temp }}/homebrew-formula

      # The floti files, byte for byte the ones `release-files` carries.
      - name: Fetch the run's floti files
        uses: actions/download-artifact@v4
        with:
          name: floti-release
          path: ${{ runner.temp }}/floti-release

      # Homebrew is installed on both runners, and on Linux is not on PATH.
      - name: Put brew on PATH
        shell: bash
        run: command -v brew >/dev/null || echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"

      # Homebrew loads no formula from a third-party tap until the tap is
      # trusted, so the install line a user is given trusts it first, before
      # it is tapped (docs/PACKAGING.md, "Homebrew and winget"). Both taps are
      # trusted that way here.
      - name: Trust both taps before they are tapped
        shell: bash
        run: |
          set -euo pipefail
          brew --version
          brew trust "$TAP"
          brew trust "$STABLE_TAP"

      - name: Tap, and check both formulas with brew style and brew audit
        shell: bash
        run: |
          set -euo pipefail
          for pair in "$TAP homebrew" "$STABLE_TAP homebrew-stable"; do
            read -r tap folder <<<"$pair"
            brew tap-new --no-git "$tap" >/dev/null
            cp "$RUNNER_TEMP/homebrew-formula/$folder/Formula/floti.rb" "$(brew --repository "$tap")/Formula/floti.rb"
            brew style "$tap/floti"
            brew audit --strict "$tap/floti"
          done

      # `brew --cache` names the file Homebrew would download the formula's URL
      # to; one already there with the right SHA-256 is used as downloaded.
      - name: Install it from the run's own file and test it
        shell: bash
        run: |
          set -euo pipefail
          cache=$(brew --cache --formula "$TAP/floti")
          mkdir -p "$(dirname "$cache")"
          cp "$RUNNER_TEMP/floti-release/floti-$VERSION-${{ matrix.target }}" "$cache"
          brew install --formula "$TAP/floti"
          brew test "$TAP/floti"
          said=$("$(brew --prefix)/bin/floti" version)
          echo "$said"
          echo "- Homebrew on \`${{ matrix.target }}\`: \`brew style\` and \`brew audit --strict\` pass the formula and its stable form, \`brew install\` and \`brew test\` pass; it runs \`$said\`" >>"$GITHUB_STEP_SUMMARY"

  # The dry run's winget manifests, checked with `winget validate`. Opens
  # nothing.
  winget-dry-run:
    needs: [version, packages-dry-run]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'true'
    runs-on: windows-latest

    steps:
      - name: Fetch the manifests
        uses: actions/download-artifact@v4
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/winget

      - name: Check them with winget validate
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Output '::error::winget is not on this runner, so the manifests cannot be validated'
            exit 1
          }
          Write-Output "winget $(winget --version)"
          $folder = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'winget') -Recurse -Filter '*.installer.yaml' | Select-Object -First 1).DirectoryName
          winget validate --manifest $folder
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::winget validate refused the manifests in $folder (exit $LASTEXITCODE)"
            exit 1
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "- winget: ``winget validate`` passes the manifests in ``$folder``"

  # floti.dev's install scripts, run for real: the only place they run, on
  # x64 and arm64 Linux and Windows and on macOS arm64. Each runner serves the run's floti files and the scripts `assemble` wrote for
  # this from http://127.0.0.1:8765, the release folder written into those
  # scripts in place of the release's own, then cuts each script off at ten
  # places and checks that none ran anything, then runs the whole script as
  # a person does (`curl | sh`, or Windows PowerShell's `irm | iex`) and checks
  # the floti it installed, then that setup ran. The drivers are
  # scripts/floti.dev/try-install.sh and try-install.ps1. Then
  # check-setup.sh or check-setup.ps1 checks what setup registered there and
  # that it runs: the systemd user unit, the LaunchAgent, or the logon task
  # "Floti host" with floti's folder on the user's Path. On Windows the run's
  # desktop installer then runs silently over that install
  # (try-installer.ps1), which must leave the same floti, the release's for
  # this CPU, and the same setup, with nothing running from the app's folder.
  # Publishes nothing.
  install-dry-run:
    needs: [version, assemble]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            setup: user-unit
          - runner: macos-latest
            target: macos-arm64
            setup: launch-agent
          - runner: windows-latest
            target: windows-x64
          # The arm64 runners, so each script's CPU detection picks arm64
          # where the computer is arm64.
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            setup: user-unit
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      # The local server is Python's; the Windows arm64 image is not known to
      # carry it.
      - uses: actions/setup-python@v5
        if: matrix.runner == 'windows-11-arm'
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Fetch the run's floti files
        uses: actions/download-artifact@v4
        with:
          name: floti-release
          path: ${{ runner.temp }}/served

      - name: Fetch the scripts that download from the local server
        uses: actions/download-artifact@v4
        with:
          name: install-scripts-local
          path: ${{ runner.temp }}/served

      - name: Install floti with install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/floti.dev/try-install.sh "$RUNNER_TEMP/served" "$VERSION" "${{ matrix.target }}"

      # Windows PowerShell, not pwsh: its children would inherit PowerShell
      # 7's module path, which Windows PowerShell cannot load its own modules
      # from.
      - name: Install floti with install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/floti.dev/try-install.ps1 -Served (Join-Path $env:RUNNER_TEMP 'served') -Version $env:VERSION -Target '${{ matrix.target }}'

      - name: Check what setup registered
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/floti.dev/check-setup.sh '${{ matrix.setup }}' "$VERSION" 'install.sh on ${{ matrix.target }}'

      - name: Check what setup registered
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/floti.dev/check-setup.ps1 -Version $env:VERSION -By 'install.ps1 on ${{ matrix.target }}'

      - name: Fetch the run's desktop installer
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/desktop

      - name: Run the desktop installer over that install
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/floti.dev/try-installer.ps1 -Installer (Join-Path $env:RUNNER_TEMP "desktop\Helm-$env:VERSION-setup.exe") -Served (Join-Path $env:RUNNER_TEMP 'served') -Version $env:VERSION -Target '${{ matrix.target }}' -Order after-script

  # The desktop's Windows installer alone, on a clean x64 and a clean arm64
  # runner where nothing of Floti's is there first: run silently and per user,
  # it must put the release's floti for this CPU in
  # %LOCALAPPDATA%\Programs\Floti\bin, put that folder on the user's Path,
  # register the logon task "Floti host" running it, and leave nothing
  # running from the app's own folder (scripts/floti.dev/try-installer.ps1).
  # Publishes nothing.
  installer-dry-run:
    needs: [version, assemble]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Fetch the run's floti files
        uses: actions/download-artifact@v4
        with:
          name: floti-release
          path: ${{ runner.temp }}/served

      - name: Fetch the run's desktop installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/desktop

      - name: Run the desktop installer on a clean runner
        shell: powershell
        run: ./scripts/floti.dev/try-installer.ps1 -Installer (Join-Path $env:RUNNER_TEMP "desktop\Helm-$env:VERSION-setup.exe") -Served (Join-Path $env:RUNNER_TEMP 'served') -Version $env:VERSION -Target '${{ matrix.target }}' -Order alone

  # install.sh in a Debian container, with curl and nothing else of the
  # runner's: python3 only serves the files. As root, setup is refused, which
  # is the line the script must reach, and registers nothing. Then as an
  # ordinary user in what setup takes for a WSL distro (`WSL_DISTRO_NAME`
  # set), where no systemd runs, setup leaves the start-on-connect marker.
  install-dry-run-debian:
    needs: [version, assemble]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    container: debian:stable-slim
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Install curl, and python3 to serve the files
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends curl ca-certificates python3 >/dev/null

      - uses: actions/checkout@v5

      - name: Fetch the run's floti files
        uses: actions/download-artifact@v4
        with:
          name: floti-release
          path: ${{ runner.temp }}/served

      - name: Fetch the scripts that download from the local server
        uses: actions/download-artifact@v4
        with:
          name: install-scripts-local
          path: ${{ runner.temp }}/served

      - name: Install floti with install.sh
        shell: sh
        run: sh scripts/floti.dev/try-install.sh "$RUNNER_TEMP/served" "$VERSION" linux-x64

      - name: Check that setup, refused as root, registered nothing
        shell: sh
        run: sh scripts/floti.dev/check-setup.sh refused "$VERSION" 'install.sh as root in debian'

      # The user reads its own copies under /tmp: the workspace and the
      # runner's folders belong to root.
      - name: Install floti with install.sh as a user, in a WSL distro without systemd
        shell: sh
        run: |
          set -eu
          useradd --create-home --shell /bin/sh floti-user
          mkdir /tmp/try
          cp -R "$RUNNER_TEMP/served" scripts/floti.dev/try-install.sh scripts/floti.dev/check-setup.sh /tmp/try/
          : >/tmp/try/summary
          chmod -R a+rX /tmp/try
          chmod a+w /tmp/try/summary
          cd /tmp
          runuser -u floti-user -- env HOME=/home/floti-user WSL_DISTRO_NAME=Debian GITHUB_STEP_SUMMARY=/tmp/try/summary sh -c '
            set -eu
            sh /tmp/try/try-install.sh /tmp/try/served "$1" linux-x64
            sh /tmp/try/check-setup.sh start-on-connect "$1" "install.sh as a user in debian taken for WSL"
          ' sh "$VERSION"
          cat /tmp/try/summary >>"$GITHUB_STEP_SUMMARY"

  # `floti add desktop` for real, on Windows, macOS and Linux runners, once a
  # release is published, preview or not, and never in a dry run: floti fetches
  # from the releases address built into it and checks the desktop files'
  # list with the key built into it, which a dry run's files, signed with a
  # key made for that run, are refused by. It downloads the release's floti
  # for the runner as anybody does, checks it against the run's SHA-256 list,
  # runs `floti add desktop` and checks the app is where add puts it with its
  # launcher entry (scripts/floti.dev/try-add-desktop.sh). On Windows and
  # macOS the app's install also ran `floti install-self`, so the setup it
  # ran is checked as the install scripts' is. A Linux runner has no display;
  # add asks only whether DISPLAY is set, and the AppImage is never started,
  # so DISPLAY is set to one that is not there. Publishes and pushes nothing,
  # and reads no secret.
  add-desktop:
    needs: [version, publish]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: macos-latest
            target: macos-arm64
          - runner: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Fetch the run's floti files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: floti-release
          path: ${{ runner.temp }}/floti-release

      - name: Install the desktop app with floti add desktop
        shell: bash
        run: |
          set -euo pipefail
          if [[ $RUNNER_OS == Linux ]]; then export DISPLAY=:99; fi
          bash scripts/floti.dev/try-add-desktop.sh "$VERSION" "$TAG" '${{ matrix.target }}' \
            "$RUNNER_TEMP/floti-release/floti-$VERSION-SHA256SUMS"

      - name: Check the setup the app's install ran
        if: runner.os == 'macOS'
        shell: bash
        run: sh scripts/floti.dev/check-setup.sh launch-agent "$VERSION" 'floti add desktop on ${{ matrix.target }}'

      - name: Check the setup the app's install ran
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/floti.dev/check-setup.ps1 -Version $env:VERSION -By 'floti add desktop on ${{ matrix.target }}'

  # The only job that writes to the repository or makes an attestation, and it
  # never runs in a dry run.
  publish:
    needs: [version, sign]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # GitHub's build attestations: a token for Sigstore, and the right to
      # store what it signs.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PREVIEW: ${{ needs.version.outputs.preview }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Fetch the release's files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: ${{ runner.temp }}/release

      - name: Fetch the release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      # What is attested and uploaded is exactly what `sign` checked.
      - name: Confirm the release's files
        shell: bash
        run: node packages/desktop/scripts/release.mjs check "$RUNNER_TEMP/release" "$VERSION" >/dev/null

      # One attestation naming every file, signatures included, made before
      # the release exists, so a failure here publishes nothing.
      - name: Attest every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail

          # A run cancelled or failed partway can leave a draft behind. A draft
          # holds the tag *name* without creating the ref, so the version gate -
          # which asks git for the tag - would not have seen it, and `gh release
          # create` would then fail on the name collision. The gate has already
          # established that no real release owns this tag, so clearing a draft
          # here is safe and makes a half-finished run self-healing.
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            echo "Deleting a leftover draft for $TAG from an earlier run."
            gh release delete "$TAG" --yes
          fi

          # Created as a draft and then flipped - deliberately, and NOT a human
          # approval gate. The draft here lives for as long as the upload takes:
          # publishing it is what creates the tag, so the ref and every asset
          # become visible in the same instant. `gh release create` with assets
          # does it the other way round - tag first, upload after - which leaves
          # a window where the app announces an update whose download page is
          # empty.
          prerelease=()
          if [[ $PREVIEW == true ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" \
            --draft "${prerelease[@]}" \
            --target "$GITHUB_SHA" \
            --title "Helm $VERSION" \
            --notes-file "$RUNNER_TEMP/notes/notes.md" \
            "$RUNNER_TEMP/release/"*

          # A preview is published like a release, so anybody can download it
          # without a GitHub sign-in and its tag is made the same way, but as a
          # pre-release and never `latest`: /releases/latest ignores
          # pre-releases, so no installed Helm is offered it. The in-app check
          # reads only the <major>.<minor>.<patch> part, so a preview of 2.4.1
          # is newer than 2.4.0 and older than the next release after it.
          if [[ $PREVIEW == true ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

      - name: Confirm the preview is a published pre-release with its files, and not latest
        if: env.PREVIEW == 'true'
        shell: bash
        run: |
          set -euo pipefail

          release=$(gh release view "$TAG" --json isDraft,isPrerelease,assets)
          assets=$(jq -r '[.assets[].name] | sort | join(", ")' <<<"$release")
          expected=$(node packages/desktop/scripts/release.mjs names "$VERSION" | paste -sd , - | sed 's/,/, /g')
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)

          [[ $(jq -r .isDraft <<<"$release") == false ]]     || { echo "::error::$TAG is still a draft"; exit 1; }
          [[ $(jq -r .isPrerelease <<<"$release") == true ]] || { echo "::error::$TAG is not a pre-release"; exit 1; }
          [[ $assets == "$expected" ]]                        || { echo "::error::assets are [$assets], expected [$expected]"; exit 1; }
          [[ $latest != "$TAG" ]]                             || { echo "::error::/releases/latest answers with the preview $TAG"; exit 1; }

          {
            echo "**Preview [\`$TAG\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)**, a published pre-release."
            echo
            echo "- \`/releases/latest\` still answers \`$latest\`; $assets"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Confirm /releases/latest answers with it
        if: env.PREVIEW != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # The exact endpoint src/main/update.ts asks. Asserting on it closes
          # the loop that the rest of this workflow only sets up: a release that
          # is published but not `latest`, or latest but missing an asset, is
          # one the app reports and the user cannot act on. The next step makes
          # the request the way a person does, with no token.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")

          tag=$(jq -r .tag_name <<<"$latest")
          draft=$(jq -r .draft <<<"$latest")
          assets=$(jq -r '[.assets[].name] | sort | join(", ")' <<<"$latest")
          expected=$(node packages/desktop/scripts/release.mjs names "$VERSION" | paste -sd , - | sed 's/,/, /g')

          [[ $tag == "$TAG" ]]       || { echo "::error::/releases/latest says $tag, expected $TAG"; exit 1; }
          [[ $draft == false ]]       || { echo "::error::$TAG is still a draft"; exit 1; }
          [[ $assets == "$expected" ]] || { echo "::error::assets are [$assets], expected [$expected]"; exit 1; }

          {
            echo "**Released [\`$TAG\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)**"
            echo
            echo "- \`/releases/latest\` -> \`$tag\`, published, $assets"
          } >>"$GITHUB_STEP_SUMMARY"

      # Every version downloads without a GitHub sign-in, previews included:
      # the desktop app for a new user, and the floti a computer of another OS
      # or CPU fetches when Settings > Hosts installs it there, with the
      # signature floti update checks it by. Each is fetched here with no
      # token at all, as they would fetch it, and must answer 200 with the
      # bytes this run built.
      - name: Confirm the files download without a sign-in
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fetched"
          for name in "Helm-$VERSION-setup.exe" "floti-$VERSION-linux-x64" "floti-$VERSION-linux-x64.minisig"; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name"
            code=$(env -u GH_TOKEN -u GITHUB_TOKEN curl --silent --show-error --location \
              --fail --retry 3 --retry-all-errors --output "$RUNNER_TEMP/fetched/$name" --write-out '%{http_code}' "$url" || true)
            [[ $code == 200 ]] || { echo "::error::$url answered $code without a sign-in, expected 200"; exit 1; }
            cmp "$RUNNER_TEMP/release/$name" "$RUNNER_TEMP/fetched/$name" \
              || { echo "::error::$url is not the $name this run built"; exit 1; }
            echo "$url: 200, the file this run built"
            echo "- \`$name\` downloads without a sign-in" >>"$GITHUB_STEP_SUMMARY"
          done

  # Formula/floti.rb in floti-dev/homebrew-tap, so `brew trust floti-dev/tap &&
  # brew install floti-dev/tap/floti` installs this release's floti on macOS
  # arm64 and on Linux x64 and arm64 (decision I9: the binary only, no cask). Only a stable
  # release updates it; a preview never does. The formula is built
  # (scripts/package-managers.mjs) from the SHA-256 list the release published,
  # fetched as anybody fetches it and checked against the committed public key
  # first, so it names exactly the files and sums the release carries.
  #
  # It runs after `publish`, so when it fails the release is already out: the
  # error names what to create, and re-running this job once it exists
  # finishes the work. The tap and its deploy key are prerequisites the owner
  # creates (docs/PACKAGING.md, "Homebrew and winget"). The deploy key reaches
  # two steps: one confirms it is set, and the other runs the one push and
  # nothing else.
  homebrew:
    needs: [version, publish]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'false' && needs.version.outputs.preview == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      TAP: floti-dev/homebrew-tap

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - id: sums
        uses: ./.github/actions/published-sums
        with:
          version: ${{ env.VERSION }}
          tag: ${{ env.TAG }}

      - name: Write the formula
        shell: bash
        env:
          SUMS: ${{ steps.sums.outputs.sums }}
        run: |
          set -euo pipefail
          node packages/desktop/scripts/package-managers.mjs formula "$SUMS" "$VERSION" "$GITHUB_REPOSITORY" >"$RUNNER_TEMP/floti.rb"
          cat "$RUNNER_TEMP/floti.rb"

      - name: Confirm the tap and the deploy key are there
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z ${HOMEBREW_TAP_DEPLOY_KEY:-} ]]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set in the release environment: add a deploy key with write access to $TAP and set its private half as that environment's secret (docs/PACKAGING.md, \"Homebrew and winget\")."
            exit 1
          fi
          if ! gh api "repos/$TAP" --silent 2>"$RUNNER_TEMP/tap.err"; then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/tap.err"; then
              echo "::error::$TAP does not exist or is not public: create it as a public repository (docs/PACKAGING.md, \"Homebrew and winget\")."
            else
              echo "::error::could not ask GitHub about $TAP: $(tr '\n' ' ' <"$RUNNER_TEMP/tap.err")"
            fi
            exit 1
          fi

      # Cloned over HTTPS, as anybody can: the key is needed only to push.
      - name: Commit the formula to the tap
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 "https://github.com/$TAP.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          # A tap created empty has no branch yet; its first is main.
          git rev-parse --verify --quiet HEAD >/dev/null || git symbolic-ref HEAD refs/heads/main
          mkdir -p Formula
          cp "$RUNNER_TEMP/floti.rb" Formula/floti.rb
          git add Formula/floti.rb
          if git diff --cached --quiet; then
            echo "Formula/floti.rb in $TAP is already this release's."
            echo "- Homebrew: \`Formula/floti.rb\` in \`$TAP\` was already \`$VERSION\`'s" >>"$GITHUB_STEP_SUMMARY"
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "floti $VERSION"
          echo "branch=$(git symbolic-ref --short HEAD)" >>"$GITHUB_OUTPUT"
          echo "changed=true" >>"$GITHUB_OUTPUT"
          # GitHub's SSH host keys, from its API over HTTPS, for the push.
          mkdir -p "$RUNNER_TEMP/tap-ssh"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >"$RUNNER_TEMP/tap-ssh/known_hosts"

      # The key goes to an owner-only file in a folder of its own, removed when
      # the step ends, whether the push worked or not. Never echo it.
      - name: Push it
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          umask 077
          keys=$(mktemp -d "$RUNNER_TEMP/tap-key.XXXXXX")
          trap 'rm -rf "$keys"' EXIT
          printf '%s\n' "${HOMEBREW_TAP_DEPLOY_KEY%$'\n'}" >"$keys/key"
          export GIT_SSH_COMMAND="ssh -i $keys/key -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/tap-ssh/known_hosts"
          if ! git push --quiet "git@github.com:$TAP.git" "HEAD:refs/heads/$BRANCH" 2>"$RUNNER_TEMP/tap-push.err"; then
            cat "$RUNNER_TEMP/tap-push.err" >&2
            if grep -qE '\[rejected\]|non-fast-forward|fetch first' "$RUNNER_TEMP/tap-push.err"; then
              echo "::error::$TAP's $BRANCH moved on after this job cloned it, so the push was refused as not a fast-forward; re-run this job, which clones it again."
            elif grep -qiE 'permission denied|publickey|read only|denied to deploy key' "$RUNNER_TEMP/tap-push.err"; then
              echo "::error::HOMEBREW_TAP_DEPLOY_KEY could not push to $TAP: add its public half to $TAP as a deploy key with write access (docs/PACKAGING.md, \"Homebrew and winget\")."
            else
              echo "::error::could not push to $TAP: $(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/tap-push.err" | tail -n 1)"
            fi
            exit 1
          fi
          echo "- Homebrew: \`Formula/floti.rb\` in \`$TAP\` is now \`$VERSION\`'s ($(git rev-parse --short HEAD) on \`$BRANCH\`)" >>"$GITHUB_STEP_SUMMARY"

  # The pull request that adds this release to winget, as FlotiDev.Floti: the
  # Windows x64 and arm64 floti as a portable command named floti (decision I9).
  # Only a stable release opens one; a preview never does. The manifests are
  # built from the published, signature-checked SHA-256 list as `homebrew`
  # builds the formula.
  #
  # The pull request is made with gh and GitHub's API alone, not an action:
  # the job holds a token that can push to a fork, and every step it runs is
  # in this repository. winget-releaser and komac update a package winget already
  # has from their own reading of the release, so they cannot submit the first
  # version, and they would write manifests of their own rather than these.
  #
  # WINGET_TOKEN is a classic token with the public_repo scope, of a GitHub
  # account kept for this alone, which holds the fork of microsoft/winget-pkgs
  # and has no access to floti-dev: public_repo lets the token push to every
  # public repository its account can, and floti-dev/floti's main is what a
  # release signs. The job finds the fork as <that account>/winget-pkgs.
  #
  # The commit's parent is upstream's master, not the fork's: the fork is never
  # synced, because syncing is refused without the workflow scope whenever
  # winget-pkgs has changed its own workflows, and the token never gets that
  # scope. On a re-run it moves its branch to a fresh commit and reuses a pull
  # request already open, and once the version is in winget-pkgs it does
  # nothing. Like `homebrew`, it fails after the release is out while a
  # prerequisite is missing, naming it.
  winget:
    needs: [version, publish]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'false' && needs.version.outputs.preview == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      UPSTREAM: microsoft/winget-pkgs

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - id: sums
        uses: ./.github/actions/published-sums
        with:
          version: ${{ env.VERSION }}
          tag: ${{ env.TAG }}

      - name: Write the manifests
        id: manifests
        shell: bash
        env:
          SUMS: ${{ steps.sums.outputs.sums }}
        run: |
          set -euo pipefail
          node packages/desktop/scripts/package-managers.mjs winget "$SUMS" "$VERSION" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/winget" \
            >"$RUNNER_TEMP/winget-paths"
          # The first is the version manifest, <folder>/<identifier>.yaml.
          first=$(head -n1 "$RUNNER_TEMP/winget-paths")
          echo "folder=$(dirname "$first")" >>"$GITHUB_OUTPUT"
          echo "id=$(basename "$first" .yaml)" >>"$GITHUB_OUTPUT"

      - name: Open the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          FOLDER: ${{ steps.manifests.outputs.folder }}
          ID: ${{ steps.manifests.outputs.id }}
        run: |
          set -euo pipefail
          setup='(docs/PACKAGING.md, "Homebrew and winget")'
          if [[ -z ${GH_TOKEN:-} ]]; then
            echo "::error::WINGET_TOKEN is not set in the release environment: set a classic token with the public_repo scope, of a GitHub account kept for this alone that holds a fork of $UPSTREAM and has no access to floti-dev, as that environment's secret $setup."
            exit 1
          fi
          if ! login=$(gh api user --jq .login 2>/dev/null); then
            echo "::error::GitHub does not accept WINGET_TOKEN: replace it with a working classic token with the public_repo scope $setup."
            exit 1
          fi

          # Succeeds when GitHub answers for the path, fails when it answers
          # 404, and ends the job on any other error rather than guessing.
          exists() {
            local said
            if said=$(gh api "$1" --silent 2>&1); then return 0; fi
            if grep -q 'HTTP 404' <<<"$said"; then return 1; fi
            echo "::error::could not ask GitHub for $1: $(tr '\n' ' ' <<<"$said")"
            exit 1
          }

          # A re-run after the pull request was merged has nothing left to do.
          if exists "repos/$UPSTREAM/contents/$FOLDER"; then
            echo "$ID $VERSION is already in $UPSTREAM."
            echo "- winget: \`$ID\` \`$VERSION\` is already in \`$UPSTREAM\`" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          fork="$login/winget-pkgs"
          parent=""
          if exists "repos/$fork"; then parent=$(gh api "repos/$fork" --jq '.parent.full_name // ""'); fi
          if [[ $parent != "$UPSTREAM" ]]; then
            echo "::error::$fork is not a fork of $UPSTREAM: fork $UPSTREAM into $login, the account WINGET_TOKEN belongs to $setup."
            exit 1
          fi

          # "New package" the first time winget-pkgs hears of it, then "New version".
          if exists "repos/$UPSTREAM/contents/$(dirname "$FOLDER")"; then kind="New version"; else kind="New package"; fi
          title="$kind: $ID version $VERSION"

          # One commit holding the three manifests, on upstream's master as it
          # is now. A fork shares its upstream's objects, so the fork's API
          # builds on that commit without the fork being synced.
          base=$(gh api "repos/$UPSTREAM/git/ref/heads/master" --jq .object.sha)
          tree=$(jq -n --arg base "$(gh api "repos/$UPSTREAM/git/commits/$base" --jq .tree.sha)" '{base_tree: $base, tree: []}')
          while IFS= read -r path; do
            blob=$(jq -n --rawfile content "$RUNNER_TEMP/winget/$path" '{content: $content, encoding: "utf-8"}' \
              | gh api "repos/$fork/git/blobs" --input - --jq .sha)
            tree=$(jq --arg path "$path" --arg sha "$blob" '.tree += [{path: $path, mode: "100644", type: "blob", sha: $sha}]' <<<"$tree")
          done <"$RUNNER_TEMP/winget-paths"
          tree_sha=$(gh api "repos/$fork/git/trees" --input - --jq .sha <<<"$tree")
          commit=$(jq -n --arg message "$title" --arg tree "$tree_sha" --arg parent "$base" '{message: $message, tree: $tree, parents: [$parent]}' \
            | gh api "repos/$fork/git/commits" --input - --jq .sha)

          branch="$ID-$VERSION"
          if gh api "repos/$fork/git/ref/heads/$branch" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$fork/git/refs/heads/$branch" -f sha="$commit" -F force=true --silent
          else
            gh api -X POST "repos/$fork/git/refs" -f ref="refs/heads/$branch" -f sha="$commit" --silent
          fi

          url=$(gh api "repos/$UPSTREAM/pulls?state=open&head=$login:$branch" --jq '.[0].html_url // ""')
          if [[ -z $url ]]; then
            body="Floti $VERSION: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"$'\n\n'"Opened by the release workflow of $GITHUB_REPOSITORY, from the release's own download URLs and its signed SHA-256 list."
            url=$(jq -n --arg title "$title" --arg head "$login:$branch" --arg body "$body" \
                '{title: $title, head: $head, base: "master", body: $body, maintainer_can_modify: true}' \
              | gh api "repos/$UPSTREAM/pulls" --input - --jq .html_url)
          fi
          echo "$title: $url"
          echo "- winget: [$title]($url)" >>"$GITHUB_STEP_SUMMARY"

  # floti.dev's install scripts and update manifest: install.sh, install.ps1,
  # update.json and update.json.minisig, at the root of
  # floti-dev/floti-dev.github.io, whose main GitHub Pages serves as
  # https://floti.dev. `assemble` wrote them and `sign` signed update.json.
  # Before one commit and one push, this job fetches the SHA-256 list the
  # release published, checks its signature against the committed public
  # key, and refuses scripts that are not byte for byte the ones that list
  # makes, and an update.json whose signature or floti files do not match.
  # Only a stable release updates them; a preview never does, and a dry run
  # never reaches this job.
  #
  # It runs after `publish`, so the scripts never name files that are not
  # downloadable yet, and when it fails the release is already out: the error
  # names what to create, and re-running this job once it exists finishes the
  # work. The deploy key, PAGES_DEPLOY_KEY in the `release` environment, is a
  # prerequisite the owner creates (docs/PACKAGING.md, "floti.dev"). It reaches
  # two steps: one confirms it is set, and the other runs the one push and
  # nothing else.
  floti-dev:
    needs: [version, publish]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.dry_run == 'false' && needs.version.outputs.preview == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      SITE: floti-dev/floti-dev.github.io
      PUBLIC_KEY: crates/host/src/update/minisign.pub

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Fetch the floti.dev files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: floti-dev
          path: ${{ runner.temp }}/floti-dev

      # The SHA-256 list the release published, fetched as anybody fetches it
      # and checked against the committed public key.
      - id: sums
        uses: ./.github/actions/published-sums
        with:
          version: ${{ env.VERSION }}
          tag: ${{ env.TAG }}

      # Exactly the four files. update.json is signed with the key floti
      # update trusts and names this release alone, on the stable channel,
      # with the published list's floti files and SHA-256s; each script is,
      # byte for byte, the one this commit writes from that list
      # (scripts/floti-dev.mjs check-scripts and check-manifest).
      - name: Confirm the files
        shell: bash
        working-directory: ${{ runner.temp }}/floti-dev
        env:
          SUMS: ${{ steps.sums.outputs.sums }}
        run: |
          set -euo pipefail
          have=$(LC_ALL=C ls -A | paste -sd ' ' -)
          [[ $have == "install.ps1 install.sh update.json update.json.minisig" ]] \
            || { echo "::error::the floti.dev files are [$have], expected install.ps1, install.sh, update.json and update.json.minisig"; exit 1; }
          scripts="$GITHUB_WORKSPACE/packages/desktop/scripts"
          node "$scripts/minisign.mjs" verify --public-key "$GITHUB_WORKSPACE/$PUBLIC_KEY" --comment "floti update.json" update.json
          node "$scripts/floti-dev.mjs" check-manifest update.json "$SUMS" "$VERSION" "$GITHUB_REPOSITORY"
          node "$scripts/floti-dev.mjs" check-scripts . "$SUMS" "$VERSION" "$GITHUB_REPOSITORY"

      - name: Confirm the site and the deploy key are there
        shell: bash
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z ${PAGES_DEPLOY_KEY:-} ]]; then
            echo "::error::PAGES_DEPLOY_KEY is not set in the release environment: add a deploy key with write access to $SITE and set its private half as that environment's secret (docs/PACKAGING.md, \"floti.dev\")."
            exit 1
          fi
          if ! gh api "repos/$SITE" --silent 2>"$RUNNER_TEMP/site.err"; then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/site.err"; then
              echo "::error::$SITE does not exist or is not public (docs/PACKAGING.md, \"floti.dev\")."
            else
              echo "::error::could not ask GitHub about $SITE: $(tr '\n' ' ' <"$RUNNER_TEMP/site.err")"
            fi
            exit 1
          fi

      # Cloned over HTTPS, as anybody can: the key is needed only to push.
      - name: Commit the files to the site
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 "https://github.com/$SITE.git" "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          cp "$RUNNER_TEMP/floti-dev/install.sh" "$RUNNER_TEMP/floti-dev/install.ps1" \
            "$RUNNER_TEMP/floti-dev/update.json" "$RUNNER_TEMP/floti-dev/update.json.minisig" .
          git add install.sh install.ps1 update.json update.json.minisig
          if git diff --cached --quiet; then
            echo "floti.dev already carries $VERSION's files."
            echo "- floti.dev: the install scripts and \`update.json\` were already \`$VERSION\`'s" >>"$GITHUB_STEP_SUMMARY"
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "floti $VERSION: the install scripts and update.json"
          echo "branch=$(git symbolic-ref --short HEAD)" >>"$GITHUB_OUTPUT"
          echo "changed=true" >>"$GITHUB_OUTPUT"
          # GitHub's SSH host keys, from its API over HTTPS, for the push.
          mkdir -p "$RUNNER_TEMP/site-ssh"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >"$RUNNER_TEMP/site-ssh/known_hosts"

      # The key goes to an owner-only file in a folder of its own, removed when
      # the step ends, whether the push worked or not. Never echo it.
      - name: Push it
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/site
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          umask 077
          keys=$(mktemp -d "$RUNNER_TEMP/site-key.XXXXXX")
          trap 'rm -rf "$keys"' EXIT
          printf '%s\n' "${PAGES_DEPLOY_KEY%$'\n'}" >"$keys/key"
          export GIT_SSH_COMMAND="ssh -i $keys/key -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/site-ssh/known_hosts"
          if ! git push --quiet "git@github.com:$SITE.git" "HEAD:refs/heads/$BRANCH" 2>"$RUNNER_TEMP/site-push.err"; then
            cat "$RUNNER_TEMP/site-push.err" >&2
            if grep -qE '\[rejected\]|non-fast-forward|fetch first' "$RUNNER_TEMP/site-push.err"; then
              echo "::error::$SITE's $BRANCH moved on after this job cloned it, so the push was refused as not a fast-forward; re-run this job, which clones it again."
            elif grep -qiE 'permission denied|publickey|read only|denied to deploy key' "$RUNNER_TEMP/site-push.err"; then
              echo "::error::PAGES_DEPLOY_KEY could not push to $SITE: add its public half to $SITE as a deploy key with write access (docs/PACKAGING.md, \"floti.dev\")."
            else
              echo "::error::could not push to $SITE: $(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/site-push.err" | tail -n 1)"
            fi
            exit 1
          fi
          echo "- floti.dev: \`install.sh\`, \`install.ps1\`, \`update.json\` and its signature are now \`$VERSION\`'s ($(git rev-parse --short HEAD) on \`$SITE\`'s \`$BRANCH\`)" >>"$GITHUB_STEP_SUMMARY"

  # The plugin SDK goes to npm on its own version, the way the app goes to
  # GitHub on its: bump packages/plugin-sdk/package.json, merge, and this job
  # publishes it. Its gate asks the registry, not git, for the reason the app's
  # asks for a tag - "is this version published" is the same answer every time.
  # A dry run skips it.
  #
  # Trusted publishing: npm trusts this workflow in this repository by OIDC,
  # set up on the package's settings page on npmjs.com, so no npm token is
  # stored anywhere, and a publish from a public repository carries provenance.
  # npm offers that only for a package that already exists, which is why the
  # first version was published by hand and why a package npm has never heard
  # of is skipped here rather than failed.
  sdk:
    needs: [version, check]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: packages/plugin-sdk

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm 11.5.1 or later; Node 24 ships it.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - id: gate
        run: |
          set -euo pipefail

          name=$(jq -er .name package.json)
          version=$(jq -er .version package.json)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error file=packages/plugin-sdk/package.json::version '$version' is not <major>.<minor>.<patch>"
            exit 1
          fi

          # A package npm has never heard of and a registry that could not be
          # asked both exit non-zero; only the first is a reason to skip.
          status=0
          versions=$(npm view "$name" versions --json 2>/dev/null) || status=$?
          if [[ $status -ne 0 ]]; then
            if [[ $(jq -r '.error.code? // empty' <<<"$versions" 2>/dev/null) == E404 ]]; then
              echo "publish=false" >>"$GITHUB_OUTPUT"
              echo "GATE: publish=false - $name is not on npm; its first version is published by hand."
              echo "**SDK not published.** \`$name\` is not on npm yet; publish its first version by hand." >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::could not ask npm which versions of $name exist: $versions"
            exit 1
          fi

          # One version comes back as a string, several as an array.
          if jq -e --arg v "$version" '(if type == "array" then . else [.] end) | index($v) != null' <<<"$versions" >/dev/null; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "GATE: publish=false - $name@$version is already on npm; bump its version to publish."
            echo "**SDK not published.** \`$name@$version\` is already on npm; bump its version to publish." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >>"$GITHUB_OUTPUT"
            echo "GATE: publish=true - $name@$version is not on npm yet."
          fi
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Publish
        if: steps.gate.outputs.publish == 'true'
        env:
          NAME: ${{ steps.gate.outputs.name }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail

          # Said here, not discovered as an authentication error: an older npm
          # does not know trusted publishing and asks for a token instead.
          npm_version=$(npm --version)
          if [[ $(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1) != 11.5.1 ]]; then
            echo "::error::npm $npm_version cannot use trusted publishing; it needs 11.5.1 or later"
            exit 1
          fi

          npm publish --provenance --access public
          echo "**Published [\`$NAME@$VERSION\`](https://www.npmjs.com/package/$NAME/v/$VERSION)** with provenance." >>"$GITHUB_STEP_SUMMARY"
