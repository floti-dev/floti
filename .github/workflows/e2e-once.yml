name: E2E before release

# Temporary: runs the end-to-end tests (`pnpm test:e2e`) once on Windows and
# macOS before a release is cut, because the machine they would otherwise run
# on cannot spare the memory. Removed before the branch merges.
on:
  push:
    branches: [agent/e2e]

concurrency:
  group: e2e-once-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      # Each OS reports on its own: a failure on one does not cancel the other.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Playwright's reporters beside the config's list reporter: JSON for the
      # skip check below, HTML for a person reading a failure.
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/reports/e2e-report.json
      PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/reports/e2e-html
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      # As in ci.yml: Windows runners check out with core.autocrlf=true.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # Version comes from `packageManager` in package.json; see ci.yml.

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # As in host.yml: the toolchain rust-toolchain.toml names, the build
      # cache, and V8's static library, which lives outside what rust-cache
      # keeps.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Cache V8's static library
        uses: actions/cache@v4
        with:
          path: target/debug/gn_out
          key: rusty-v8-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rusty-v8-${{ runner.os }}-

      - name: Fetch V8 again when its static library is missing
        shell: bash
        run: |
          if [ ! -f target/debug/gn_out/obj/rusty_v8.lib ] && [ ! -f target/debug/gn_out/obj/librusty_v8.a ]; then
            cargo clean -p v8
          fi

      # The arguments after the script's name reach Playwright, the last
      # command of test:e2e.
      - name: End-to-end tests
        id: e2e
        run: pnpm test:e2e --reporter=list,json,html

      # No spec skips a test, so any skipped test is unexpected. This names
      # each one with the reason Playwright recorded, and fails when there is
      # one.
      - name: No test skipped
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs")
            const file = process.env.PLAYWRIGHT_JSON_OUTPUT_FILE
            if (!fs.existsSync(file)) { console.log("No JSON report: the run did not reach Playwright."); process.exit(1) }
            const report = JSON.parse(fs.readFileSync(file, "utf8"))
            const skipped = []
            const walk = (suite, path) => {
              const here = suite.title ? [...path, suite.title] : path
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  if (test.status !== "skipped") continue
                  const reasons = [...(test.annotations ?? []), ...(test.results ?? []).flatMap(r => r.annotations ?? [])]
                    .filter(a => a.type === "skip" || a.type === "fixme")
                    .map(a => a.type + (a.description ? ": " + a.description : ""))
                  skipped.push(`${spec.file}:${spec.line} > ${[...here, spec.title].join(" > ")} (${reasons.join("; ") || "no reason recorded; not run, likely after a worker stopped"})`)
                }
              }
              for (const child of suite.suites ?? []) walk(child, here)
            }
            for (const suite of report.suites ?? []) walk(suite, [])
            const s = report.stats ?? {}
            console.log(`expected ${s.expected}, unexpected ${s.unexpected}, flaky ${s.flaky}, skipped ${s.skipped}`)
            if (skipped.length === 0) { console.log("Nothing skipped."); process.exit(0) }
            console.log(`${skipped.length} skipped:`)
            for (const line of skipped) console.log("  " + line)
            process.exit(1)
          '

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            reports/e2e-html
            reports/e2e-report.json
            reports/e2e-results
          if-no-files-found: ignore
          retention-days: 14
