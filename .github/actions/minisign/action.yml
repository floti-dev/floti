name: minisign
description: >
  Puts minisign 0.12 for Linux x64 on PATH, from its GitHub release, after
  checking the archive against the SHA-256 written here.

# The version and the SHA-256 change together. The archive's own signature,
# minisign-<version>-linux.tar.gz.minisig, was checked once against its
# author's published key (RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3)
# when this SHA-256 was written; from then on the SHA-256 is what holds the
# run to that file.
runs:
  using: composite
  steps:
    - name: Install minisign
      shell: bash
      env:
        MINISIGN_VERSION: '0.12'
        MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
      run: |
        set -euo pipefail
        if [[ $RUNNER_OS != Linux || $RUNNER_ARCH != X64 ]]; then
          echo "::error::the minisign action installs the Linux x64 build; this runner is $RUNNER_OS $RUNNER_ARCH"
          exit 1
        fi
        dir="$RUNNER_TEMP/minisign-$MINISIGN_VERSION"
        archive="$dir/minisign-$MINISIGN_VERSION-linux.tar.gz"
        mkdir -p "$dir"
        curl --fail --silent --show-error --location --retry 3 --retry-all-errors --output "$archive" \
          "https://github.com/jedisct1/minisign/releases/download/$MINISIGN_VERSION/minisign-$MINISIGN_VERSION-linux.tar.gz"
        echo "$MINISIGN_SHA256  $archive" | sha256sum --check --strict
        # The archive also holds macOS metadata files beside each entry; only
        # the one binary is taken.
        tar -xzf "$archive" -C "$dir" --no-same-owner --warning=no-unknown-keyword minisign-linux/x86_64/minisign
        echo "$dir/minisign-linux/x86_64" >>"$GITHUB_PATH"
        "$dir/minisign-linux/x86_64/minisign" -v
